<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFCA00">
  <title>No internet connection — Sviy dlya Svoikh</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #fffbea; color: #222; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .card { max-width: 380px; width: 100%; text-align: center; background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #555; margin: 0 0 24px; line-height: 1.45; }
    button { padding: 12px 24px; border: 0; border-radius: 8px; background: #e6b800; font-size: 16px; font-weight: 600; cursor: pointer; }
    .status { margin-top: 16px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">No internet connection</h1>
      <p id="text">Could not connect to the server. Check your internet connection — we will retry automatically, and you stay signed in.</p>
      <button type="button" id="retry">Try now</button>
      <div class="status" id="status">Checking connection…</div>
    </div>
  </div>
  <script>
    var messages = {
      en: {
        title: 'No internet connection',
        text: 'Could not connect to the server. Check your internet connection — we will retry automatically, and you stay signed in.',
        retry: 'Try now',
        checking: 'Checking connection…',
        offline: 'Still offline. We will try again in a few seconds.',
        pageTitle: 'No internet connection — Sviy dlya Svoikh'
      },
      uk: {
        title: 'Немає зв\'язку', // i18n-ignore
        text: 'Не вдалося з\'єднатися із сервером. Перевірте інтернет — ми спробуємо автоматично, а ваш вхід збережено.', // i18n-ignore
        retry: 'Спробувати зараз', // i18n-ignore
        checking: 'Перевіряємо з\'єднання…', // i18n-ignore
        offline: 'Поки без зв\u2019язку. Повторимо за кілька секунд.', // i18n-ignore
        pageTitle: 'Немає зв\'язку — СВІЙ ДЛЯ СВОЇХ' // i18n-ignore
      }
    };

    function detectLocale() {
      var match = document.cookie.match(/(?:^|;\s*)sviy_locale=([^;]+)/);
      var saved = match ? decodeURIComponent(match[1]) : '';
      if (saved === 'uk' || saved === 'en') return saved;
      var lang = (navigator.language || 'en').toLowerCase();
      return lang.indexOf('uk') === 0 ? 'uk' : 'en';
    }

    var locale = detectLocale();
    var dict = messages[locale];
    document.documentElement.lang = locale;
    document.title = dict.pageTitle;
    document.getElementById('title').textContent = dict.title;
    document.getElementById('text').textContent = dict.text;
    document.getElementById('retry').textContent = dict.retry;
    document.getElementById('status').textContent = dict.checking;

    var busy = false;
    function check() {
      if (busy) return;
      busy = true;
      fetch('/api/health', { cache: 'no-store' })
        .then(function (res) { if (res.status < 500) location.reload(); else throw new Error('server'); })
        .catch(function () { document.getElementById('status').textContent = dict.offline; })
        .then(function () { busy = false; });
    }
    document.getElementById('retry').addEventListener('click', check);
    window.addEventListener('online', check);
    setInterval(check, 5000);
    check();
  </script>
</body>
</html>
