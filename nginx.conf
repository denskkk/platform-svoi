# Захист від перебору паролів і перевантаження (зони підключаються на рівні http; файл підключається з /etc/nginx/conf.d або sites-enabled)
limit_req_zone $binary_remote_addr zone=svoi_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=svoi_api:10m rate=50r/s;

server {
    listen 80;
    server_name sviydlyasvoih.com.ua www.sviydlyasvoih.com.ua;

    # Максимальный размер загружаемых файлов (для фото профилей и услуг)
    client_max_body_size 10M;

    # Завантаження відео (до 150 МБ): без буферизації на диск nginx, великий таймаут
    location = /api/videos/upload {
        client_max_body_size 160M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # Вхід і реєстрація: до 30 запитів на хвилину з одного IP (сплеск 20); ліміт м’який, бо мобільні мережі ділять один IP
    location ~ ^/api/auth/(login|register|register-business)$ {
        limit_req zone=svoi_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Решта API: загальний ліміт 50 запитів/с з IP (сплеск 100)
    location /api/ {
        limit_req zone=svoi_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Проксирование на Next.js приложение
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Кеширование статических файлов Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Завантажені користувачами файли (/uploads/*) віддає сам застосунок
    # (через /api/uploads) — це працює «з коробки».
    # ДЛЯ ШВИДКОСТІ (необов’язково): якщо розкоментувати блок нижче й вказати реальний шлях
    # до каталогу завантажень (UPLOADS_DIR), nginx віддаватиме файли напряму з диска,
    # не навантажуючи Node.js. Якщо файлу немає на диску — запит піде у застосунок.
    # location /uploads/ {
    #     alias /var/www/platform-svoi/public/uploads/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    #     try_files $uri @app;
    # }
    # location @app { proxy_pass http://127.0.0.1:3000; }

    # Favicon и другие статические файлы
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|ttf|otf|svg|woff2|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Логи
    access_log /var/log/nginx/sviydlyasvoih-access.log;
    error_log /var/log/nginx/sviydlyasvoih-error.log;
}
